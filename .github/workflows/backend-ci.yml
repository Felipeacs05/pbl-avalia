name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docs/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docs/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tfs_user
          POSTGRES_PASSWORD: tfs_pass
          POSTGRES_DB: tfs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Instalar cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Aplicar schema no banco de teste
        run: |
          psql postgresql://tfs_user:tfs_pass@localhost:5432/tfs_test -f ../docs/schema.sql

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Rodar testes (Maven)
        run: ./mvnw test -B --no-transfer-progress
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tfs_test
          SPRING_DATASOURCE_USERNAME: tfs_user
          SPRING_DATASOURCE_PASSWORD: tfs_pass

      - name: Publicar relatório de testes JUnit
        if: always()
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: Resultados JUnit Backend
          path: 'backend/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload do relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-backend
          path: backend/target/surefire-reports/

services:
  postgres:
    image: postgres:16-alpine
    container_name: avalia_postgres
    restart: always
    environment:
      POSTGRES_USER: tfs_user
      POSTGRES_PASSWORD: tfs_pass
      POSTGRES_DB: tfs_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfs_user -d tfs_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    container_name: avalia_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tfs_test
      - SPRING_DATASOURCE_USERNAME=tfs_user
      - SPRING_DATASOURCE_PASSWORD=tfs_pass
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET_KEY=bXlfc3VwZXJfc2VjcmV0X2tleV9mb3JfdGVzdGluZ18xMjM0NTY3ODkwMTI=
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: avalia_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - NEXT_PUBLIC_USE_MOCKS=false
    depends_on:
      - backend

volumes:
  postgres_data:
